name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build static website
        run: npm run build
      - name: Check site and domain
        run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow after Pages deploy
        shell: bash
        run: |
          key="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("site.config.json","utf8")).indexNowKey)')"
          payload="$(node -e 'process.stdout.write(JSON.stringify({host:"overflowbar.top",key:process.argv[1],keyLocation:`https://overflowbar.top/${process.argv[1]}.txt`,urlList:["https://overflowbar.top/","https://overflowbar.top/install/","https://overflowbar.top/help/","https://overflowbar.top/guides/mac-menu-bar-overflow/","https://overflowbar.top/zh/","https://overflowbar.top/zh/install/","https://overflowbar.top/zh/help/","https://overflowbar.top/zh/guides/mac-menu-bar-overflow/"]}))' "$key")"
          status="$(curl --silent --show-error --output /tmp/indexnow-response.txt --write-out '%{http_code}' --request POST https://api.indexnow.org/indexnow --header 'Content-Type: application/json; charset=utf-8' --data "$payload")"
          if [[ ! "$status" =~ ^(200|202)$ ]]; then
            cat /tmp/indexnow-response.txt
            echo "IndexNow submission failed with HTTP $status" >&2
            exit 1
          fi
          echo "IndexNow accepted notification for eight URLs (HTTP $status); this does not confirm indexing."
